version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - '127.0.0.1:${MYSQL_EXTERNAL_PORT:-3306}:${DB_PORT:-3306}'
      - '${MAIN_SERVICE_PRIVATE_HOST:-10.16.0.1}:${MYSQL_EXTERNAL_PORT:-3306}:${DB_PORT:-3306}'
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - etp_parsing_network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: phpmyadmin
    restart: always
    ports:
      - "127.0.0.1:${PHPMYADMIN_EXTERNAL_PORT:-8081}:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    depends_on:
      - mysql
    networks:
      - etp_parsing_network

  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - '127.0.0.1:${NGINX_HTTP_EXTERNAL_PORT:-80}:80'
      - '${MAIN_SERVICE_PRIVATE_HOST:-10.16.0.1}:${NGINX_HTTP_EXTERNAL_PORT:-80}:80'
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./files:/usr/share/nginx/html/files
    restart: unless-stopped
    networks:
      - etp_parsing_network

  splash:
    image: scrapinghub/splash
    container_name: splash
    restart: always
    ports:
      - "127.0.0.1:${SPLASH_EXTERNAL_PORT:-8050}:8050"
    command: [ "--maxrss", "1024", "--max-timeout", "3600" ]
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1g
    networks:
      - etp_parsing_network

  app:
    image: etp_parsing:latest
    container_name: app
    build:
      args:
        USER: ${USER}
        UID: ${UID:-1000}
      context: ./docker/app
      dockerfile: ./Dockerfile
    restart: unless-stopped
    volumes:
      - ./:/var/www/app
      - ./docker/app/supervisord.conf:/etc/supervisor/supervisord.conf
    depends_on:
      - mysql
      - splash
    networks:
      - etp_parsing_network

volumes:
  mysql_data:

networks:
  etp_parsing_network:
    driver: bridge
