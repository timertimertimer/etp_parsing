version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: mysql
    restart: unless-stopped
    env_file: 
      - .env
    ports:
      - "${MYSQL_PORT}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - etp_parsing_network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: phpmyadmin
    restart: always
    ports:
      - "${PHPMYADMIN_PORT:-8081}:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    depends_on:
      - mysql
    networks:
      - etp_parsing_network

  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "8082:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./files:/usr/share/nginx/html/files
    restart: unless-stopped
    networks:
      - etp_parsing_network

  splash:
    image: scrapinghub/splash
    container_name: splash
    restart: always
    ports:
      - "8050:8050"
    command: [ "--maxrss", "1024", "--max-timeout", "3600" ]
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1g
    networks:
      - etp_parsing_network

  app:
    image: etp_parsing:latest
    container_name: app
    build:
      args:
        USER: ${USER}
        UID: ${UID:-1000}
      context: ./docker/app
      dockerfile: ./Dockerfile
    restart: unless-stopped
    volumes:
      - ./:/var/www/app
      - ./docker/app/supervisord.conf:/etc/supervisor/supervisord.conf
    depends_on:
      - mysql
      - splash
    networks:
      - etp_parsing_network

volumes:
  mysql_data:

networks:
  etp_parsing_network:
    driver: bridge
